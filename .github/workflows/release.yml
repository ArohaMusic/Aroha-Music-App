name: Signed release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, for example v1.0.0'
        required: true
        type: string
      firebase:
        description: 'Include Firebase usage and optional crash reporting'
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      FIREBASE_ENABLED: ${{ (github.event_name == 'push' && vars.RELEASE_FIREBASE == 'true') || (github.event_name == 'workflow_dispatch' && inputs.firebase) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag and source
        id: metadata
        run: |
          git show-ref --verify "refs/tags/$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/main
          python3 scripts/release_metadata.py "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          python3 scripts/public_source.py
          python3 scripts/audit_publication.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/export_source.py
      - name: Check signing secrets
        env:
          AROHA_KEYSTORE_BASE64: ${{ secrets.AROHA_KEYSTORE_BASE64 }}
          AROHA_KEYSTORE_PASSWORD: ${{ secrets.AROHA_KEYSTORE_PASSWORD }}
          AROHA_KEY_ALIAS: ${{ secrets.AROHA_KEY_ALIAS }}
        run: |
          test -n "$AROHA_KEYSTORE_BASE64" || { echo 'Missing AROHA_KEYSTORE_BASE64 secret'; exit 1; }
          test -n "$AROHA_KEYSTORE_PASSWORD" || { echo 'Missing AROHA_KEYSTORE_PASSWORD secret'; exit 1; }
          test -n "$AROHA_KEY_ALIAS" || { echo 'Missing AROHA_KEY_ALIAS secret'; exit 1; }
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-read-only: true
      - name: Configure optional Firebase
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [[ "$FIREBASE_ENABLED" == 'true' ]]; then
            test -n "$GOOGLE_SERVICES_JSON_BASE64" || { echo 'Missing GOOGLE_SERVICES_JSON_BASE64 secret'; exit 1; }
            umask 077
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
            python3 scripts/validate_firebase.py app/google-services.json
            echo 'FIREBASE_ARG=-PfirebaseAnalytics=true -PuploadCrashMappings=true' >> "$GITHUB_ENV"
          fi
      - name: Build, test, lint and verify inventory
        run: |
          ./gradlew ${FIREBASE_ARG:-} :app:assembleRelease :app:testDebugUnitTest :app:lintDebug
          ./gradlew ${FIREBASE_ARG:-} -I scripts/runtime_inventory.init.gradle :app:writeRuntimeInventory
          git diff --exit-code -- LICENSES/runtime-dependencies.json LICENSES/runtime-dependencies-firebase.json
          python3 scripts/security_audit.py
      - name: Sign and verify APK
        env:
          AROHA_KEYSTORE_BASE64: ${{ secrets.AROHA_KEYSTORE_BASE64 }}
          AROHA_KEYSTORE_PASSWORD: ${{ secrets.AROHA_KEYSTORE_PASSWORD }}
          AROHA_KEY_ALIAS: ${{ secrets.AROHA_KEY_ALIAS }}
          AROHA_KEY_PASSWORD: ${{ secrets.AROHA_KEY_PASSWORD }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          bash scripts/sign_release.sh \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            "dist/Aroha-Music-${RELEASE_VERSION}.apk" \
            "$ANDROID_HOME/build-tools/36.0.0"
      - name: Verify production identity and upgrade version
        env:
          EXPECTED_CERTIFICATE: ${{ vars.RELEASE_CERT_SHA256 }}
          ALLOW_FIRST_RELEASE: ${{ vars.ALLOW_FIRST_RELEASE }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          RELEASE_CODE: ${{ steps.metadata.outputs.version_code }}
        run: |
          test -n "$EXPECTED_CERTIFICATE" || { echo 'Configure RELEASE_CERT_SHA256 from the production signing certificate'; exit 1; }
          bootstrap=()
          if [[ "$ALLOW_FIRST_RELEASE" == 'true' ]]; then bootstrap+=(--allow-first-release); fi
          python3 scripts/release_health.py --previous "$RUNNER_TEMP/previous-stable.apk" "${bootstrap[@]}"
          baseline=()
          if [[ -f "$RUNNER_TEMP/previous-stable.apk" ]]; then
            baseline+=(--previous "$RUNNER_TEMP/previous-stable.apk")
          elif [[ "$ALLOW_FIRST_RELEASE" == 'true' ]]; then
            baseline+=(--first-release)
          fi
          python3 scripts/release_safety.py "dist/Aroha-Music-${RELEASE_VERSION}.apk" \
            --tools "$ANDROID_HOME/build-tools/36.0.0" --certificate "$EXPECTED_CERTIFICATE" \
            --version "$RELEASE_VERSION" --version-code "$RELEASE_CODE" "${baseline[@]}" \
            --output dist/release-identity.json
      - name: Prepare public release artifacts
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          cp "dist/Aroha-Music-${RELEASE_VERSION}.apk" dist/Aroha-Music-latest.apk
          cp LICENSES/runtime-dependencies*.json dist/
          (cd dist && sha256sum ./*.apk ./*.zip ./*.json > SHA256SUMS.txt)
          python3 scripts/release_notes.py "$RELEASE_VERSION" > "$RUNNER_TEMP/release-notes.md"
      - name: Preserve release crash mappings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-mapping-${{ steps.metadata.outputs.version }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90
      - name: Upload signed release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signed-release-${{ steps.metadata.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Refuse to overwrite an existing release, especially a published one.
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo 'A release already exists for this tag. Download the run artifacts to review; existing assets were not overwritten.'
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/*.apk dist/*.zip dist/*.json dist/SHA256SUMS.txt \
            --verify-tag --draft --title "Aroha Music ${RELEASE_TAG#v}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
      - name: Remove private build inputs
        if: always()
        run: rm -f app/google-services.json
